spring:
  application:
    name: ledger

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: 2s
      timeout: 2s

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ecommerce_dev}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true
    url: ${FLYWAY_DB_URL:${DB_URL:jdbc:postgresql://localhost:5432/ecommerce_dev}}
    user: ${FLYWAY_DB_USERNAME:${DB_USERNAME:postgres}}
    password: ${FLYWAY_DB_PASSWORD:${DB_PASSWORD:}}
    baseline-on-migrate: true
    baseline-version: 0

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  forward-headers-strategy: framework
  port: ${PORT:8080}

app:
  bootstrap:
    admin:
      enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
      username: ${BOOTSTRAP_ADMIN_USERNAME:}
      email: ${BOOTSTRAP_ADMIN_EMAIL:}
      number: ${BOOTSTRAP_ADMIN_NUMBER:}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  cors:
    allowed-origins: "${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173,http://localhost:8080,http://172.21.32.1:3000,https://kqzt0n4p-3000.inc1.devtunnels.ms,http://localhost:3001}"

jwt:
  secret: ${JWT_SECRET}
  refresh-secret: ${JWT_REFRESH_SECRET:${JWT_SECRET}}
  expirationMs: ${JWT_EXPIRATION_MS:86400000}
  refreshExpirationMs: ${JWT_REFRESH_EXPIRATION_MS:86400000}

whaths-app-base:
  url: ${WHATSAPP_API_URL:http://localhost:3000/whatsapp/send}
  base: ${WHATSAPP_API_BASE:http://localhost:3000}

logging:
  level:
    root: INFO
    snovasys.ledger: INFO
    org.springframework.security: INFO
