
spring:
  application:
    name: ledger
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      connect-timeout: 2s
      timeout: 2s

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ecommerce_dev}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}

    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  forward-headers-strategy: framework
  port: ${PORT:8080}

# Kept for the existing CorsConfig bean, which reads a comma-separated value.
app:
  bootstrap:
    admin:
      enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
      username: ${BOOTSTRAP_ADMIN_USERNAME:}
      email: ${BOOTSTRAP_ADMIN_EMAIL:}
      number: ${BOOTSTRAP_ADMIN_NUMBER:}
      password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}


jwt:
  secret: ${JWT_SECRET}
  refresh-secret: ${JWT_REFRESH_SECRET:${JWT_SECRET}}

  expirationMs: ${JWT_EXPIRATION_MS:86400000}
  refreshExpirationMs: ${JWT_REFRESH_EXPIRATION_MS:86400000}


whaths-app-base:
  url: ${WHATSAPP_API_URL:http://localhost:3000/whatsapp/send}
  base: ${WHATSAPP_API_BASE:http://localhost:3000}

